<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Surf4Miles logo">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c4d82e"/>
            <stop offset="100%" stop-color="#8fb91a"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#bg)"/>

    <!-- back wave -->
    <path d="M0,42 C8,36 16,36 24,41 C32,46 40,46 48,40 C54,36 60,37 64,40 L64,64 L0,64 Z"
          fill="#ffffff" opacity="0.45"/>
    <!-- front wave -->
    <path d="M0,50 C10,44 18,44 26,49 C34,54 42,54 50,48 C56,44 60,45 64,48 L64,64 L0,64 Z"
          fill="#ffffff" opacity="0.85"/>

    <!-- car body -->
    <path d="M9,37 L10.5,31 C11.3,27 14.5,24.5 18.5,24 L27,23 C31.5,22.7 35.8,24 38.5,27 L43,31.5 L50,33.5 C52.8,34.3 54.5,35.8 54.5,38 L54.5,39 L9,39 Z"
          fill="#2d3748"/>
    <!-- windscreen / glass -->
    <path d="M20,27.3 L27.3,26.3 C30.3,26 33,27 34.8,29 L36.3,30.8 L20.6,31.5 Z"
          fill="#eafccb"/>

    <!-- wheels -->
    <circle cx="19" cy="39" r="4.6" fill="#2d3748"/>
    <circle cx="19" cy="39" r="1.7" fill="#eafccb"/>
    <circle cx="45" cy="39" r="4.6" fill="#2d3748"/>
    <circle cx="45" cy="39" r="1.7" fill="#eafccb"/>
</svg>
